<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome 2026</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: black;
      color: white;
      text-align: center;
    }
    #container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }
    #container h1 { font-size: 40px; margin-bottom: 10px; }
    #container p { font-size: 20px; }
    #container button {
      margin-top: 30px;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      background: red;
      color: white;
    }
    #emoji-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }
    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="emoji-bg"></div>

<div id="container">
  <h1>🎆 Welcome to 2026 🎆</h1>
  <p>✨ “New year, new beginnings, new adventures—make every moment count!”</p>
  <p>🚀 “Dream big, work hard, and let the new year take you to new heights.”</p>
  <button onclick="goHome()">Back to Home</button>
</div>

<script>
/* ---------- NAVIGATION ---------- */
function goHome(){ window.location.href="index.html"; }

/* ---------- CANVAS FIREWORKS ---------- */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
window.addEventListener("resize",resize); resize();

let particles=[];

class Particle{
  constructor(x,y){ this.x=x; this.y=y; this.size=Math.random()*3+1; this.speedX=Math.random()*6-3; this.speedY=Math.random()*-5-2; this.life=100; this.color=`hsl(${Math.random()*360},100%,50%)`; }
  update(){ this.x+=this.speedX; this.y+=this.speedY; this.speedY+=0.05; this.life--; }
  draw(){ ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill(); }
}

function firework(){
  const x=Math.random()*canvas.width;
  const y=Math.random()*canvas.height/2;
  for(let i=0;i<120;i++) particles.push(new Particle(x,y));
}

function animate(){
  ctx.fillStyle="rgba(0,0,0,0.25)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  particles.forEach((p,i)=>{ p.update(); p.draw(); if(p.life<=0) particles.splice(i,1); });
  requestAnimationFrame(animate);
}

setInterval(firework,2000);
animate();

/* ---------- EMOJI FLOATING BACKGROUND ---------- */
const emojiBg = document.getElementById("emoji-bg");
const emojis = ["🎂","🎄","🎆","🎁","🍰"];

function createEmoji(){
  const span=document.createElement("span");
  span.innerText=emojis[Math.floor(Math.random()*emojis.length)];
  span.style.position="absolute";
  span.style.left=Math.random()*100+"vw";
  span.style.bottom="-50px";
  span.style.fontSize=Math.random()*30+20+"px";
  span.style.opacity="0.8";
  span.style.transition="transform 10s linear, opacity 10s linear";
  emojiBg.appendChild(span);
  setTimeout(()=>{ span.style.transform=`translateY(-110vh) rotate(${Math.random()*360}deg)`; span.style.opacity="0"; },50);
  setTimeout(()=>{ span.remove(); },10000);
}

setInterval(createEmoji,500);
</script>

</body>
</html>
